site_name: LabKit
site_description: A well-typed, scalable framework for automated laboratory measurement.
repo_url: https://github.com/Mgnsoscar/LabKit
repo_name: Mgnsoscar/LabKit

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            members_order: source
            separate_signature: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Units & quantities: units.md
  - Plotting: plotting.md
  - Saving data (CSV): io.md
  - Instruments: instruments.md
  - Design & rationale: design/architecture.md
